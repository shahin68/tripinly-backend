name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: tripinly
          POSTGRES_PASSWORD: tripinly
          POSTGRES_DB: tripinly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tripinly -d tripinly_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://tripinly:tripinly@localhost:5432/tripinly_test
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://tripinly:tripinly@localhost:5432/tripinly_test
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:7070
      # Test-only values; real secrets live in Railway.
      JWT_ACCESS_SECRET: ci-only-access-token-secret-at-least-32-chars
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install osmium (OSM import tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool
      - run: npm ci
      - run: npx prisma generate
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrations match the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Start S3 stand-in (photo storage for integration tests)
        # VersityGW validates SigV4 like R2 does. MinIO no longer publishes images.
        run: |
          docker run -d --name s3 -p 7070:7070 \
            -e ROOT_ACCESS_KEY=minioadmin -e ROOT_SECRET_KEY=minioadmin \
            -e VGW_REGION=auto -e VGW_BACKEND=posix -e VGW_BACKEND_ARG=/tmp/vgw \
            versity/versitygw:v1.8.0
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:7070 && break; sleep 1; done
      - name: Integration tests
        run: npm run test:integration
      - name: OpenAPI spec is up to date
        run: |
          npm run openapi
          git diff --exit-code openapi.json || (echo "::error::openapi.json is stale. Run 'npm run build && npm run openapi' and commit it." && exit 1)

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
