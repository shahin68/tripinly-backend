# Local development stack. `docker compose up -d db redis s3` for dependencies
# while running the app with `npm run start:dev`, or `docker compose up` for everything.
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: tripinly
      POSTGRES_PASSWORD: tripinly
      POSTGRES_DB: tripinly
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgis-init.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripinly -d tripinly']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 (used from the photos stage on).
  # With the posix backend a bucket is a directory, so the photo bucket is created here.
  s3:
    image: versity/versitygw:v1.8.0
    entrypoint: ['/bin/sh', '-c']
    command:
      - mkdir -p /data/tripinly-photos && exec versitygw --region auto posix /data
    environment:
      ROOT_ACCESS_KEY: tripinly
      ROOT_SECRET_KEY: tripinly-secret
    ports:
      - '7070:7070'
    volumes:
      - s3-data:/data

  migrate:
    build: .
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: &app-env
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://tripinly:tripinly@db:5432/tripinly
      REDIS_URL: redis://redis:6379
      # Local-only values; never reuse them anywhere else.
      JWT_ACCESS_SECRET: local-compose-access-token-secret-32chars
      ENCRYPTION_KEY: ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
      # Upload and image URLs are signed for this host, so the app must reach it too
      # (e.g. http://10.0.2.2:7070 from the Android emulator; change both together).
      R2_ENDPOINT: http://s3:7070
      R2_ACCESS_KEY_ID: tripinly
      R2_SECRET_ACCESS_KEY: tripinly-secret
      R2_BUCKET: tripinly-photos
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *app-env
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ['node', 'dist/main.worker.js']
    environment:
      <<: *app-env
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db-data:
  s3-data:
